services:
  - type: web
    name: nova-shoes
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NOVA_ADMIN_EMAIL
        sync: false
      - key: NOVA_ADMIN_PASSWORD
        sync: false